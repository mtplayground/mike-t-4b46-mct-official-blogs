<header class="border-b border-editorial-line bg-editorial-white">
  <div class="page-shell flex items-center justify-between py-5">
    <a class="flex items-center gap-2" href="/" aria-label="ideavibes blog">
      <img class="h-8 w-auto" src="https://ideavibes.ai/logo.png" alt="ideavibes blog" width="190" height="48">
      <span class="text-xl font-bold text-editorial-ink">blog</span>
    </a>
    <nav class="flex items-center gap-5 text-sm font-bold text-editorial-muted" aria-label="Primary navigation">
      {% for link in nav_links %}
        <a class="transition hover:text-editorial-red" href="{{ link.href }}"{% if link.opens_new_tab %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
